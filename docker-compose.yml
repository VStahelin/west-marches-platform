services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-westmarches}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-westmarches}
      POSTGRES_DB: ${POSTGRES_DB:-westmarches}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-westmarches}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3001
      DATABASE_URL: postgres://${POSTGRES_USER:-westmarches}:${POSTGRES_PASSWORD:-westmarches}@postgres:5432/${POSTGRES_DB:-westmarches}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
    ports:
      - "3001:3001"
    volumes:
      - backend_uploads:/app/apps/backend/uploads
      - backend_quadrants:/app/apps/backend/quadrants
      - ./apps/backend/wiki:/app/apps/backend/wiki
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  backend_uploads:
  backend_quadrants:
